name: IPTV Auto Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # 每天北京时间 10 点 UTC

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ 安装 Python3 + pip + ffmpeg
      - name: Install Python, pip and ffmpeg
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip ffmpeg
          python3 --version
          pip3 --version
          ffmpeg -version

      # 3️⃣ 安装 Python 依赖
      - name: Install Python deps
        run: pip3 install requests

      # 4️⃣ 运行 IPTV 检测脚本
      - name: Run IPTV script
        run: python3 check_ip.py

      # 5️⃣ 调试输出文件（可选）
      - name: Show output files (debug)
        run: |
          echo "==== current_ip.txt ===="
          cat current_ip.txt || echo "empty"
          echo "==== output.m3u ===="
          cat output.m3u || echo "empty"
          echo "========================"

      # 6️⃣ 提交更新到仓库
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add current_ip.txt output.m3u
          git commit -m "update IPTV source" || echo "no changes"
          git push
